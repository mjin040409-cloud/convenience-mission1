<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편의점 미션: 똑똑한 장바구니</title>
<style>
:root{--bg:#f3f7ee;--card:#fff;--tx:#1d2a1f;--mut:#5d6b5f;--line:#d9e2d2;--ac:#1f8a4c;--acs:#dff3e6;--bad:#d33a2c;--bads:#fde6e3;--warn:#b7791f;--sign:#ffd23f;--signtx:#1d2a1f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121a14;--card:#1b261e;--tx:#e8f0e9;--mut:#9fb0a2;--line:#2c3b2f;--ac:#4cc47c;--acs:#1c3a28;--bad:#ff7b6e;--bads:#3b1f1c;--warn:#f0b955}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121a14;--card:#1b261e;--tx:#e8f0e9;--mut:#9fb0a2;--line:#2c3b2f;--ac:#4cc47c;--acs:#1c3a28;--bad:#ff7b6e;--bads:#3b1f1c;--warn:#f0b955}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5;padding-bottom:110px}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
.sign{background:var(--sign);color:var(--signtx);padding:14px;border-bottom:4px solid #1f8a4c}
.sign h1{margin:0;font-size:20px;letter-spacing:-.02em}.sign p{margin:2px 0 0;font-size:13px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.tab{flex:0 0 auto;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.tab[aria-pressed=true]{border-color:var(--ac);background:var(--acs);font-weight:700}
.mission{background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:14px}
.mission h2{margin:0 0 6px;font-size:18px}.mission p{margin:0 0 10px;font-size:14px}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rule{font-size:13px;background:var(--acs);border-radius:8px;padding:3px 9px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 8px}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:4px}
.item.in{border:2px solid var(--ac)}
.em{font-size:30px;line-height:1}.nm{font-size:14px;font-weight:700}.pr{font-size:14px;color:var(--ac);font-weight:700}
.nu{font-size:11.5px;color:var(--mut);line-height:1.45}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.qty button.add{background:var(--ac);color:#fff;border-color:var(--ac)}
.qty span{font-weight:700;min-width:20px;text-align:center}
button:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ac);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
.bar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.tot{flex:1;font-size:13px;color:var(--mut)}.tot b{font-size:17px;color:var(--tx)}.tot b.over{color:var(--bad)}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:#fff}
.btn.ghost{background:var(--acs);color:var(--tx)}
#panel{display:none;position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);padding:10px 14px;z-index:19;max-height:50vh;overflow:auto}
#panel.open{display:block}#panel .in{max-width:720px;margin:0 auto}
.m{margin:7px 0}.m .t{display:flex;justify-content:space-between;font-size:13px}
.track{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin-top:3px}
.fill{height:100%;background:var(--ac);border-radius:5px}.fill.bad{background:var(--bad)}.fill.wait{background:var(--warn)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 16px}
#modal.open{display:block}
.res{max-width:560px;margin:0 auto;background:var(--card);border-radius:16px;padding:18px}
.res h2{margin:0;font-size:22px}.stars{font-size:28px;margin:4px 0}
.row{display:flex;gap:8px;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.row.ok{background:var(--acs)}.row.no{background:var(--bads)}
.tip{background:var(--bg);border-left:4px solid var(--sign);padding:10px 12px;border-radius:6px;font-size:14px;margin:10px 0}
.foot{font-size:12px;color:var(--mut);margin:22px 0 0}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
</style>
</head>
<body>
<div class="sign"><div class="wrap" style="padding:0"><h1>🏪 편의점 미션: 똑똑한 장바구니</h1><p>미션 조건에 딱 맞게 담고, 계산대에서 점수를 확인해요.</p></div></div>
<div class="wrap">
<div class="tabs" id="tabs"></div>
<div class="mission" id="mission"></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
<p class="foot">※ 영양 수치는 편의점 대표 제품을 바탕으로 한 대략값이에요. 실제 구매할 때는 제품 뒷면의 영양성분표를 꼭 확인하세요. 이 게임은 끼니를 거르거나 극단적으로 적게 먹는 것을 권하지 않으며, 균형 있게 먹는 연습을 위한 교육용이에요.</p>
</div>
<div id="panel"><div class="in" id="meters"></div></div>
<div class="bar"><div class="in">
<div class="tot"><div id="cnt">담은 상품 0개</div><b id="sum">0원</b> / <span id="bud"></span></div>
<button class="btn ghost" id="pbtn">조건 현황</button>
<button class="btn" id="pay">계산하기</button>
</div></div>
<div id="modal"><div class="res" id="res"></div></div>
<script>
const raw=`🍙|참치마요 삼각김밥|식사|1500|200|34|3|5|5|480
🍙|전주비빔 삼각김밥|식사|1400|190|35|4|3|5|520
🥗|닭가슴살 샐러드|식사|3900|150|10|5|4|20|380
🥪|계란 샌드위치|식사|2800|330|35|7|16|12|600
🍜|컵라면|식사|1500|450|65|4|16|9|1700
🍔|햄버거|식사|3500|430|42|6|20|17|850
🌭|핫도그|식사|2000|300|30|6|15|9|600
🍗|훈제 닭가슴살|식사|2200|110|1|0|2|23|420
🥚|맥반석 구운란 2개|식사|1600|140|2|1|10|12|150
🍠|군고구마|신선|2500|160|37|12|0|2|20
🍌|바나나|신선|1500|90|23|12|0|1|0
🍎|컵과일|신선|2500|70|17|13|0|0|0
🥬|채소 스틱|신선|2000|40|8|4|0|2|30
🥜|견과류 한 봉|간식|1500|170|6|2|14|6|0
🧀|스트링 치즈|간식|1200|80|1|0|6|6|170
🥣|무가당 그릭요거트|간식|2500|110|7|5|4|10|50
🥐|크림빵|간식|1800|380|50|24|17|6|250
🍫|초코바|간식|1500|250|32|24|12|3|60
🍟|감자칩|간식|1700|270|26|1|17|3|350
🍦|아이스크림 콘|간식|1800|250|34|22|12|3|70
🌭|소시지 바|간식|1700|200|3|2|17|8|650
💧|생수|음료|800|0|0|0|0|0|0
🫧|무가당 탄산수|음료|1000|0|0|0|0|0|10
🥛|무가당 두유|음료|1500|90|6|1|5|7|60
🥛|흰우유|음료|1300|130|10|10|7|6|100
🥤|콜라 500ml|음료|2200|215|54|54|0|0|15
🧃|과일주스|음료|1800|130|30|28|0|0|10
🧋|밀크티|음료|2800|250|45|40|7|2|80`;
const P=raw.split("\n").map((l,i)=>{const a=l.split("|");return{id:i,e:a[0],n:a[1],c:a[2],pr:+a[3],kcal:+a[4],carb:+a[5],sugar:+a[6],fat:+a[7],prot:+a[8],sod:+a[9]}});
const L={price:["가격","원"],kcal:["열량","kcal"],carb:["탄수화물","g"],sugar:["당류","g"],fat:["지방","g"],prot:["단백질","g"],sod:["나트륨","mg"],dsugar:["음료 속 당류","g"],drink:["음료","개"],fresh:["과일·채소","개"],cnt:["상품 수","개"]};
const R=(k,op,v)=>({k,op,v});
const M=[
{t:"🩸 점심 후 혈당 스파이크 막기",d:"점심 먹고 나면 급격히 졸리고 수업에 집중이 안 돼요. 혈당을 확 올리지 않는 점심을 골라 보세요. 단, 배는 든든해야 해요!",
 r:[R("price","max",6000),R("carb","max",60),R("sugar","max",12),R("fat","max",20),R("prot","min",15),R("kcal","min",300),R("drink","min",1)],
 tip:"정제 탄수화물과 설탕이 많은 음식은 혈당을 빨리 올렸다가 급히 떨어뜨려요. 단백질·식이섬유와 함께 먹고, 마실 것은 물·무가당 음료로 바꾸면 졸음이 줄어요."},
{t:"🌙 야간 자율학습 간식",d:"밤 9시, 배는 출출하지만 자기 전까지 부담 없는 간식이 필요해요. 열량과 짠맛은 낮추고 포만감은 챙기세요.",
 r:[R("price","max",4000),R("kcal","max",300),R("sugar","max",10),R("sod","max",600),R("prot","min",10),R("cnt","min",2)],
 tip:"늦은 시간엔 단 과자·튀긴 과자보다 단백질 간식(치즈, 요거트, 달걀)이 포만감이 오래가요. 짠 음식은 야식 후 붓기와 갈증을 부르기도 해요."},
{t:"📝 시험 날 아침 든든 도시락",d:"시험 날 아침을 못 먹고 나왔어요. 머리가 잘 돌아가도록 에너지는 천천히, 오래 나오는 조합으로 구성하세요.",
 r:[R("price","max",5000),R("carb","min",30),R("carb","max",70),R("sugar","max",14),R("prot","min",12),R("fat","max",15),R("fresh","min",1)],
 tip:"뇌는 포도당을 쓰지만, 한꺼번에 많이 들어오면 오히려 집중력이 흔들려요. 탄수화물은 적당히, 단백질·과일·채소와 함께 먹으면 에너지가 천천히 나와요."},
{t:"🏃 체육대회 전 에너지 충전",d:"한 시간 뒤 체육대회! 힘은 낼 수 있되 속이 더부룩하지 않도록, 음료는 설탕 없이 구성하세요.",
 r:[R("price","max",7000),R("kcal","min",300),R("kcal","max",500),R("prot","min",20),R("sugar","max",20),R("dsugar","max",5),R("sod","max",900),R("fat","max",18)],
 tip:"운동 전 기름진 음식은 속을 무겁게 하고, 단 음료는 금방 지쳐요. 물과 함께 소화가 편한 탄수화물 + 단백질 조합이 좋아요."}
];
let mi=0,cart={},cat="전체";
const $=id=>document.getElementById(id),won=n=>n.toLocaleString("ko-KR")+"원";
function tot(){const t={price:0,kcal:0,carb:0,sugar:0,fat:0,prot:0,sod:0,dsugar:0,drink:0,fresh:0,cnt:0};
 P.forEach(p=>{const q=cart[p.id]||0;if(!q)return;t.price+=p.pr*q;["kcal","carb","sugar","fat","prot","sod"].forEach(k=>t[k]+=p[k]*q);t.cnt+=q;if(p.c==="음료"){t.drink+=q;t.dsugar+=p.sugar*q}if(p.c==="신선")t.fresh+=q});return t}
const rl=r=>L[r.k][0]+" "+r.v.toLocaleString("ko-KR")+L[r.k][1]+(r.op==="max"?" 이하":" 이상");
const ok=(r,t)=>r.op==="max"?t[r.k]<=r.v:t[r.k]>=r.v;
function head(){
 $("tabs").innerHTML=M.map((m,i)=>`<button class="tab" aria-pressed="${i===mi}" data-m="${i}">미션 ${i+1}</button>`).join("");
 const m=M[mi];$("mission").innerHTML=`<h2>${m.t}</h2><p>${m.d}</p><div class="rules">${m.r.map(r=>`<span class="rule">${rl(r)}</span>`).join("")}</div>`;
 $("bud").textContent=won(m.r[0].v);
 $("chips").innerHTML=["전체","식사","신선","간식","음료"].map(c=>`<button class="chip" aria-pressed="${c===cat}" data-c="${c}">${c}</button>`).join("");
}
function draw(){
 $("grid").innerHTML=P.filter(p=>cat==="전체"||p.c===cat).map(p=>{const q=cart[p.id]||0;
 return `<div class="item ${q?"in":""}"><div class="em">${p.e}</div><div class="nm">${p.n}</div><div class="pr">${won(p.pr)}</div>
 <div class="nu">${p.kcal}kcal · 탄수 ${p.carb}g<br>당 ${p.sugar}g · 지방 ${p.fat}g<br>단백질 ${p.prot}g · 나트륨 ${p.sod}mg</div>
 <div class="qty">${q?`<button data-a="-" data-i="${p.id}" aria-label="${p.n} 빼기">−</button><span>${q}</span>`:`<span></span><span></span>`}<button class="add" data-a="+" data-i="${p.id}" aria-label="${p.n} 담기">+</button></div></div>`}).join("");
 const t=tot(),b=M[mi].r[0].v;
 $("cnt").textContent=`담은 상품 ${t.cnt}개`;$("sum").textContent=won(t.price);$("sum").className=t.price>b?"over":"";
 $("meters").innerHTML=M[mi].r.map(r=>{const v=t[r.k],good=ok(r,t),pct=Math.min(100,v/r.v*100);
  const cls=r.op==="max"?(good?"":"bad"):(good?"":"wait");
  return `<div class="m"><div class="t"><span>${good?"✅":r.op==="max"?"⚠️":"⏳"} ${rl(r)}</span><b>${v.toLocaleString("ko-KR")}${L[r.k][1]}</b></div><div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div></div>`}).join("");
}
function pay(){
 const t=tot(),m=M[mi];
 if(!t.cnt){alert("먼저 장바구니에 상품을 담아 주세요!");return}
 const res=m.r.map(r=>({r,good:ok(r,t)})),n=res.filter(x=>x.good).length,sc=Math.round(n/res.length*100);
 const st=sc===100?3:sc>=70?2:1;
 const tips=res.filter(x=>!x.good).map(({r})=>{
  const k=r.k;
  if(k==="price")return `예산을 ${won(t.price-r.v)} 넘었어요. 가격이 낮으면서 단백질이 풍부한 삼각김밥·달걀·두유 조합을 살펴보세요.`;
  if(r.op==="max"&&["kcal","carb","sugar","fat","sod"].includes(k)){
   const top=P.filter(p=>cart[p.id]).sort((a,b)=>b[k]*cart[b.id]-a[k]*cart[a.id])[0];
   return `${L[k][0]}이(가) 많아요. 가장 큰 원인은 ‘${top.n}’(${top[k]*cart[top.id]}${L[k][1]})이에요. 다른 상품으로 바꿔 보세요.`}
  if(k==="dsugar"){const top=P.filter(p=>cart[p.id]&&p.c==="음료").sort((a,b)=>b.sugar-a.sugar)[0];return `음료에 당이 많아요. ‘${top.n}’ 대신 생수·무가당 탄산수·무가당 두유를 골라 보세요.`}
  if(k==="drink")return "마실 것을 담지 않았어요. 물이나 무가당 음료는 부담 없이 수분을 채워 줘요.";
  if(k==="fresh")return "과일·채소가 빠졌어요. 바나나, 군고구마, 채소 스틱은 포만감을 주고 영양을 채워요.";
  if(k==="cnt")return "상품 수가 부족해요. 작은 간식 여러 개로 나눠 먹으면 만족감도 커요.";
  const best=P.filter(p=>p.c!=="음료").sort((a,b)=>b[k]-a[k]).slice(0,3).map(p=>p.n).join(", ");
  return `${L[k][0]}이(가) 모자라요. ${best} 같은 상품을 참고해 보세요.`});
 const msg=sc===100?"완벽해요! 조건을 모두 지키면서 예산 안에서 균형 있게 골랐어요. 🎉":sc>=70?"좋아요! 몇 가지만 바꾸면 완벽해질 거예요.":"괜찮아요, 다시 고르면서 영양성분표 읽는 연습을 해 봐요.";
 $("res").innerHTML=`<h2>계산 완료! ${sc}점</h2><div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div><p>${msg}</p>
 ${res.map(({r,good})=>`<div class="row ${good?"ok":"no"}"><span>${good?"✅":"❌"}</span><span>${rl(r)}<br><small>내 장바구니: ${t[r.k].toLocaleString("ko-KR")}${L[r.k][1]}</small></span></div>`).join("")}
 ${tips.length?`<div class="tip"><b>💡 이렇게 바꿔 볼까요?</b><br>${tips.join("<br>")}</div>`:""}
 <div class="tip"><b>📚 알아두기</b><br>${m.tip}</div>
 <div class="acts"><button class="btn ghost" id="again">다시 담기</button><button class="btn" id="next">${mi<M.length-1?"다음 미션":"처음으로"}</button></div>`;
 $("modal").classList.add("open");
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.m){mi=+b.dataset.m;cart={};head();draw()}
 else if(b.dataset.c){cat=b.dataset.c;head();draw()}
 else if(b.dataset.a){const i=b.dataset.i;cart[i]=Math.max(0,(cart[i]||0)+(b.dataset.a==="+"?1:-1));if(!cart[i])delete cart[i];draw()}
 else if(b.id==="pbtn")$("panel").classList.toggle("open");
 else if(b.id==="pay")pay();
